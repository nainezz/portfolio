name: Project screenshots

# Takes fresh screenshots of every live project and commits them to the branch.
# Runs when the screenshot script changes, or from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    paths:
      - tools/screenshots.mjs
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1 sharp@0
      - run: npx playwright install --with-deps chromium
      - run: node tools/screenshots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/projects
          git diff --cached --quiet || git commit -m "Update project screenshots"
          git push
